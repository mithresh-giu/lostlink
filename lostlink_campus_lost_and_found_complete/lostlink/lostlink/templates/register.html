{% extends "base.html" %}
{% block title %}Register Campus Account – LostLink{% endblock %}

{% block content %}
<div class="container-narrow">
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Create Campus Account</h1>
      <span class="badge badge-available">Student / Staff</span>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-row">
        <div class="form-group">
          <label for="full_name" class="form-label">Full Name <span class="required-star">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Nishanth U" value="{{ form_data.get('full_name', '') }}" required>
        </div>
        <div class="form-group">
          <label for="register_no" class="form-label">Register No. / Staff ID <span class="required-star">*</span></label>
          <input type="text" id="register_no" name="register_no" class="form-control" placeholder="e.g. 25IT111" value="{{ form_data.get('register_no', '') }}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email" class="form-label">Campus Email <span class="required-star">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@kpriet.ac.in" value="{{ form_data.get('email', '') }}" required>
        </div>
        <div class="form-group">
          <label for="phone" class="form-label">Mobile Number <span class="required-star">*</span></label>
          <input type="text" id="phone" name="phone" class="form-control" placeholder="+91 94870 00000" value="{{ form_data.get('phone', '') }}" required>
        </div>
      </div>

      <div class="form-group">
        <label for="department" class="form-label">Department</label>
        <input type="text" id="department" name="department" class="form-control" value="{{ form_data.get('department', 'Information Technology') }}">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required-star">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>
        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password <span class="required-star">*</span></label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-success btn-block">Register Account</button>
    </form>

    <p style="margin-top:1rem; font-size:0.88rem; text-align:center;">
      Already registered? <a href="{{ url_for('auth.login') }}"><strong>Sign In here</strong></a>
    </p>
  </div>
</div>
{% endblock %}
